<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e6f0fc">
<title>Feliz cumpleaños</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Great+Vibes&family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --crema:#e6f0fc;
  --crema2:#f4f9ff;
  --vino:#1f3f7a;
  --rojo:#2f6fe0;
  --rosa:#7fb6f5;
  --dorado:#dfe9f7;
  --gris:#5f7291;
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --fina:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --script:'Great Vibes','Brush Script MT',cursive;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;font-family:var(--fina);color:var(--vino);
  background:radial-gradient(90% 70% at 50% 0%,var(--crema2) 0%,var(--crema) 62%,#d3e3f7 100%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--rojo);outline-offset:3px}
.oculto{display:none!important}
.simbolos{position:absolute;width:0;height:0;overflow:hidden}

/* =========== 1. INTRO: flecha y corazón =========== */
#intro{position:fixed;inset:0;z-index:20;touch-action:none;user-select:none;-webkit-user-select:none;
  background:radial-gradient(90% 70% at 50% 0%,var(--crema2) 0%,var(--crema) 62%,#d3e3f7 100%);transition:opacity .6s}
.hola{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 11dvh);text-align:center;font-style:italic;font-weight:500;font-size:17px;letter-spacing:.14em;color:#3f6db5}
.halo{position:absolute;left:50%;top:34dvh;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;
  background:radial-gradient(circle,rgba(79,143,240,.42) 0%,rgba(79,143,240,.16) 42%,transparent 70%);animation:halo 2.6s ease-in-out infinite}
@keyframes halo{50%{transform:scale(1.12);opacity:.8}}
#corazon{position:absolute;left:50%;top:34dvh;width:112px;height:112px;margin:-56px 0 0 -56px;filter:drop-shadow(0 10px 16px rgba(47,111,224,.35));animation:latido 2.6s ease-in-out infinite}
#corazon svg{width:100%;height:100%;display:block}
#corazon.pop{animation:none;transition:transform .28s ease-out,opacity .28s ease-out;transform:scale(1.35);opacity:0}
@keyframes latido{50%{transform:scale(1.07)}}
.pista-arco{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 4.5dvh);text-align:center;font-size:15px;letter-spacing:.26em;color:#6b86ad;transition:opacity .4s}
#escenario{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.chispa{position:fixed;width:16px;height:16px;margin:-8px 0 0 -8px;pointer-events:none;z-index:30;animation:salir .95s ease-out forwards}
.chispa svg{width:100%;height:100%;display:block}
@keyframes salir{0%{transform:translate(0,0) rotate(0) scale(.6);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1.1);opacity:0}}
.disco{position:fixed;z-index:40;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 40% 35%,#4b86ee,#2358c4);box-shadow:0 0 0 16px rgba(60,120,230,.35),0 0 0 38px rgba(60,120,230,.16);
  transform:scale(0);transition:transform 1s cubic-bezier(.65,0,.3,1)}

/* =========== 2. PANTALLA ROJA =========== */
#roja{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(75% 55% at 18% 12%,rgba(150,200,255,.7) 0%,transparent 62%),linear-gradient(165deg,#2f6fe0 0%,#2456c4 100%);
  color:#fff;opacity:0;visibility:hidden;transition:opacity .5s,visibility .5s;overflow:hidden}
#roja.on{opacity:1;visibility:visible}
#roja.fuera{opacity:0;visibility:hidden;transition:opacity 1.1s ease,visibility 1.1s}
.deseo{font-style:italic;font-weight:500;font-size:19px;letter-spacing:.06em;color:#dcecff;opacity:0;margin-bottom:10px}
#roja.on .deseo{animation:aparece .9s .2s forwards}
.feliz{font-family:var(--serif);font-weight:900;font-size:clamp(40px,13.4vw,84px);line-height:1.02;letter-spacing:.005em;text-shadow:0 4px 24px rgba(10,30,100,.25)}
.fila{display:block;white-space:nowrap}
.letra{display:inline-block;opacity:0;transform:translateY(14px);filter:blur(6px);transition:opacity .5s ease,transform .5s ease,filter .5s ease}
.letra.on{opacity:1;transform:none;filter:none}
.subrayado{width:min(58vw,240px);height:12px;margin-top:6px;overflow:visible}
.subrayado path{fill:none;stroke:#c6dcf5;stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .9s ease}
.subrayado.on path{stroke-dashoffset:0}
.sub{margin-top:16px;font-style:italic;font-weight:500;font-size:17px;letter-spacing:.08em;color:#dcecff;opacity:0;transition:opacity .8s}
.sub.on{opacity:1}
.destello{position:absolute;left:50%;top:56%;width:90vmin;height:90vmin;margin:-45vmin 0 0 -45vmin;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(225,240,255,.95) 0%,rgba(160,205,255,.5) 26%,transparent 62%);opacity:0;transform:scale(.1)}
.destello.on{animation:destello 1s ease-out forwards}
@keyframes destello{0%{opacity:0;transform:scale(.1)}35%{opacity:1}100%{opacity:0;transform:scale(1.5)}}
@keyframes aparece{to{opacity:1}}

/* =========== 3. ÁRBOL =========== */
#escena{position:fixed;inset:0;z-index:1}
#titulo-app{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 14px);z-index:8;text-align:center;font-family:var(--serif);font-weight:700;font-size:13px;letter-spacing:.03em;color:var(--vino);opacity:0;transition:opacity 1s .3s;pointer-events:none}
body.arbol #titulo-app{opacity:1}
.arbol-caja{position:absolute;left:50%;top:5dvh;width:min(100vw,600px);height:84dvh;transform:translateX(-50%)}
.arbol-caja svg{width:100%;height:100%;display:block;overflow:visible;transform-origin:50% 100%}
body.arbol .arbol-caja svg{animation:mecer 7s ease-in-out infinite alternate}
@keyframes mecer{from{transform:rotate(-.7deg)}to{transform:rotate(.7deg)}}
.rama{fill:none;stroke:#2f4f86;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
body.arbol .rama{animation:crecer var(--t,1.4s) cubic-bezier(.45,.05,.3,1) var(--d,0s) forwards}
@keyframes crecer{to{stroke-dashoffset:0}}
.brote{transform:scale(0)}
body.arbol .brote{animation:brotar .75s cubic-bezier(.3,1.7,.5,1) var(--d,3s) forwards}
@keyframes brotar{to{transform:scale(1)}}
#petalos{position:fixed;inset:0;z-index:4;pointer-events:none;overflow:hidden}
.petalo{position:absolute;top:16dvh;left:var(--x);width:var(--s);height:var(--s);opacity:0;animation:caer var(--t) linear var(--d) infinite}
.petalo svg{width:100%;height:100%;display:block}
@keyframes caer{0%{opacity:0;transform:translate3d(0,0,0) rotate(0)}10%{opacity:.95}88%{opacity:.9}100%{opacity:0;transform:translate3d(var(--dx),78dvh,0) rotate(var(--r))}}

/* =========== rollo con tarjetas =========== */
#rollo{position:fixed;inset:0;z-index:6;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;visibility:hidden;scrollbar-width:none}
#rollo::-webkit-scrollbar{display:none}
body.arbol #rollo{visibility:visible}
.portada{position:relative;height:100dvh}
.saludo{position:absolute;left:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 7dvh);padding:14px 22px 14px 18px;border-radius:18px;
  background:rgba(244,249,255,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);text-align:left;opacity:0;transform:translateY(24px)}
body.arbol .saludo{animation:sube 1.1s ease 4.2s forwards}
@keyframes sube{to{opacity:1;transform:none}}
.saludo .a{font-style:italic;font-weight:600;font-size:15px;color:#3f6db5}
.saludo .b{display:block;font-family:var(--script);font-size:50px;line-height:.95;color:#2c5cc0;text-shadow:0 2px 8px rgba(44,92,192,.2);margin:2px 0 4px}
.saludo .c{font-style:italic;font-weight:500;font-size:15px;color:var(--gris)}
.desliza{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 1.6dvh);text-align:center;font-size:14px;letter-spacing:.2em;color:#6b86ad;opacity:0;transition:opacity .5s}
body.arbol .desliza{animation:aparece 1s 6.4s forwards}
.desliza.fuera{animation:none;opacity:0}
.desliza i{display:block;width:10px;height:10px;margin:6px auto 0;border-right:2px solid #3f6db5;border-bottom:2px solid #3f6db5;transform:rotate(45deg);animation:rebote 1.5s ease-in-out infinite}
@keyframes rebote{50%{transform:translateY(5px) rotate(45deg)}}
.panel{width:min(92vw,430px);margin:0 auto 26px;opacity:0;transform:translateY(46px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.8,.2,1)}
.panel.visto{opacity:1;transform:none}
.tarjeta{background:rgba(250,253,255,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:24px;padding:18px;box-shadow:0 14px 40px rgba(31,63,122,.14),0 2px 6px rgba(31,63,122,.08)}
.cab{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.cab h2{font-family:var(--serif);font-weight:700;font-size:19px;color:var(--vino)}
.cab span{font-size:14px;color:var(--gris);font-style:italic}
.boton-regalo{display:flex;align-items:center;gap:8px;margin:20px auto 0;padding:0 26px;height:50px;border-radius:99px;
  background:linear-gradient(180deg,#4a86ee,#2456c4);color:#fff;font-family:var(--serif);font-weight:600;font-size:16px;box-shadow:0 10px 24px rgba(36,86,196,.35);transition:transform .15s}
.boton-regalo:active{transform:scale(.96)}
.relleno{height:12dvh}

/* =========== pastel =========== */
.tp{font-family:var(--serif);font-weight:700;font-size:24px;line-height:1.15;color:var(--vino);text-align:center}
.ayuda-p{margin-top:4px;text-align:center;font-size:17px;font-style:italic;color:var(--gris)}
.pastel-card,.anios-card,.video-card,.regalo-card{padding:22px 18px 20px}
.pastel-svg{display:block;width:min(100%,320px);margin:10px auto 0;cursor:pointer;overflow:visible}
.pastel-svg .plato,.pastel-svg .capa,.pastel-svg .cre,.pastel-svg .vela,.pastel-svg .llama-v{opacity:0;transform-box:fill-box}
.pastel-svg .humo{opacity:0;transform-box:fill-box;transform-origin:center}
.visto .pastel-svg .plato{animation:encenderP .6s .1s both;transform-origin:center}
.visto .pastel-svg .c1{animation:caerC .9s .5s both}
.visto .pastel-svg .c1f{animation:cubrirC .6s 1.3s both;transform-origin:top}
.visto .pastel-svg .c2{animation:caerC .9s 1.8s both}
.visto .pastel-svg .c2f{animation:cubrirC .6s 2.6s both;transform-origin:top}
.visto .pastel-svg .c3{animation:caerC .9s 3s both}
.visto .pastel-svg .c3f{animation:cubrirC .6s 3.8s both;transform-origin:top}
.visto .pastel-svg .vela{animation:brotaV .5s 4.3s both;transform-origin:bottom}
.visto .pastel-svg .vela:nth-of-type(2){animation-delay:4.45s}
.visto .pastel-svg .llama-v{transform-origin:50% 100%;animation:encenderP .4s 5s both,parpadeo .4s 5.4s ease-in-out infinite alternate}
@keyframes caerC{0%{opacity:0;transform:translateY(-150px)}55%{opacity:1;transform:translateY(8px)}78%{transform:translateY(-3px)}100%{opacity:1;transform:none}}
@keyframes cubrirC{from{opacity:0;transform:translateY(-14px) scaleY(.5)}to{opacity:1;transform:none}}
@keyframes brotaV{from{opacity:0;transform:scaleY(0)}to{opacity:1;transform:scaleY(1)}}
@keyframes encenderP{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
@keyframes parpadeo{from{transform:scale(1,1) rotate(-2deg)}to{transform:scale(.92,1.09) rotate(2deg)}}
.pastel-svg.apagado .llama-v{animation:none!important;opacity:0;transform:scale(.2)}
.pastel-svg.apagado .humo{animation:humo 1.7s ease-out forwards}
@keyframes humo{0%{opacity:.75;transform:translateY(0) scale(.6)}100%{opacity:0;transform:translateY(-38px) scale(1.9)}}
.final-p{min-height:26px;margin-top:8px;text-align:center;font-size:20px;font-style:italic;color:var(--vino);opacity:0;transition:opacity .9s}
.final-p.on{opacity:1}

/* =========== años =========== */
.anios-card{text-align:center}
.btn-edad{position:relative;width:190px;height:190px;margin:22px auto 6px;border-radius:50%;display:grid;place-items:center;color:#fff;
  background:radial-gradient(circle at 35% 28%,#7fb6f5,#2f6fe0 58%,#1f4fb8);box-shadow:0 14px 34px rgba(36,86,196,.4),inset 0 -6px 14px rgba(10,30,100,.28);
  touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.btn-edad::before{content:"";position:absolute;inset:-12px;border-radius:50%;border:2px solid rgba(79,143,240,.5);animation:anillo 2.2s ease-out infinite;pointer-events:none}
@keyframes anillo{0%{transform:scale(.94);opacity:.9}100%{transform:scale(1.16);opacity:0}}
.btn-edad span{display:block}
.btn-edad .num{display:block;font-family:var(--serif);font-weight:900;font-size:64px;line-height:1}
.btn-edad small{display:block;margin-top:2px;font-size:18px;font-style:italic;color:#dcecff}
.btn-edad.pop .num{animation:popn .18s ease}
@keyframes popn{50%{transform:scale(1.14)}}
.btn-edad.infinito{background:radial-gradient(circle at 35% 28%,#dcecff,#4f8ff0 55%,#1f4fb8);box-shadow:0 0 44px 8px rgba(127,182,245,.65),inset 0 -6px 14px rgba(10,30,100,.28)}
.btn-edad.infinito .num{font-size:92px;text-shadow:0 0 18px rgba(255,255,255,.8)}
.pista-a{margin-top:20px;font-size:17px;font-style:italic;color:var(--gris)}

/* =========== recuerdos interactivos =========== */
.recuerdos-card{padding:18px 14px 16px}
.recuerdos-card .cab{padding:0 4px}
.pila{position:relative;width:min(74vw,286px);height:min(50dvh,400px);margin:22px auto 12px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.polaroid{position:absolute;inset:0;perspective:1100px;transition:transform .42s cubic-bezier(.2,.8,.2,1),opacity .42s;will-change:transform;cursor:grab}
.polaroid.arrastrando{transition:none;cursor:grabbing}
.giro{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.3,1.25,.4,1)}
.polaroid.voltea .giro{transform:rotateY(180deg)}
.cara{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6px;background:#fdfeff;padding:12px 12px 0;
  box-shadow:0 12px 30px rgba(31,63,122,.22),0 2px 6px rgba(31,63,122,.12)}
.marco{position:relative;height:calc(100% - 66px);border-radius:3px;overflow:hidden;background:linear-gradient(135deg,#d6e6fb,#e4f0ff)}
.marco img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
.marco .hueco{display:none;position:absolute;inset:0;align-items:center;justify-content:center;text-align:center;padding:10px;font-size:14px;line-height:1.25;color:#6f8fbd;font-style:italic}
.marco.sinfoto img{display:none}
.marco.sinfoto .hueco{display:flex}
.leyenda{height:66px;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--script);font-size:29px;line-height:1;color:#2c5cc0}
.dorso{transform:rotateY(180deg);display:flex;flex-direction:column;justify-content:center;text-align:center;padding:26px 24px;background:linear-gradient(170deg,#12306e,#0c1f4d);color:#fff}
.dorso h4{font-family:var(--script);font-weight:400;font-size:34px;line-height:1.1;color:#bfe0ff;margin-bottom:12px}
.dorso p{font-size:19px;font-style:italic;line-height:1.5;color:#e6f0ff}
.dorso .volver{margin-top:18px;font-size:13px;font-style:normal;letter-spacing:.14em;color:#8fb3e6}
.pila-ctrl{display:flex;align-items:center;justify-content:center;gap:18px;font-size:15px;color:var(--gris)}
.redondo{width:42px;height:42px;border-radius:50%;background:#fff;border:1px solid #cfe0f7;font-size:24px;line-height:1;color:var(--vino);box-shadow:0 4px 12px rgba(31,63,122,.12)}
.redondo:active{transform:scale(.92)}

/* =========== video =========== */
.marco-video{margin-top:14px;border-radius:16px;overflow:hidden;background:#0c1f4d;position:relative}
.marco-video video{display:block;width:100%;max-height:64dvh;background:#0c1f4d}
.sin-video{padding:60px 20px;text-align:center;font-size:16px;font-style:italic;color:#9fc8fa}

/* =========== regalo (caja) =========== */
.regalo-card{text-align:center}
.caja{width:min(52vw,200px);display:block;margin:22px auto 8px}
.caja svg{width:100%;height:auto;overflow:visible}
.caja .tapa{transition:transform .7s cubic-bezier(.3,1.3,.5,1);transform-box:fill-box;transform-origin:left bottom}
.caja.abierta .tapa{transform:translate(4px,-30px) rotate(-12deg)}
.caja:not(.abierta) svg{animation:latidoCaja 2.6s ease-in-out infinite}
@keyframes latidoCaja{50%{transform:translateY(-4px)}}
.vale{max-height:0;opacity:0;overflow:hidden;transition:max-height .9s ease,opacity .9s ease}
.vale.visible{max-height:560px;opacity:1}
.vale h3{font-family:var(--serif);font-weight:700;font-size:21px;line-height:1.25;color:#2456c4;margin-top:8px}
.vale p{margin-top:8px;font-size:18px;line-height:1.45;font-style:italic;color:var(--gris)}
.codigo{display:inline-flex;align-items:center;gap:10px;margin-top:16px;padding:8px 8px 8px 16px;border:1px dashed #a9c8f2;border-radius:10px;background:#eef5ff;font-family:var(--serif);font-weight:600;font-size:14px;letter-spacing:.05em;color:#2456c4}
.codigo button{font-family:var(--fina);font-weight:600;font-size:15px;padding:8px 13px;border-radius:7px;background:#2f6fe0;color:#fff}

/* =========== cielo de estrellas =========== */
.cielo-card{position:relative;overflow:hidden;padding:22px 16px 18px;border-radius:24px;text-align:center;color:#fff;
  background:linear-gradient(170deg,#12306e 0%,#0c1f4d 100%);box-shadow:0 14px 40px rgba(31,63,122,.28)}
.cielo-card h2{font-family:var(--serif);font-weight:700;font-size:25px;line-height:1.1}
.ayuda-c{margin-top:4px;font-size:17px;font-style:italic;color:#b9d0f2}
.campo-c{position:relative;height:290px;margin:12px 0 4px;border-top:1px solid rgba(159,200,250,.22);border-bottom:1px solid rgba(159,200,250,.22)}
.campo-c svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.campo-c line{stroke:#9fc8fa;stroke-width:1.4;vector-effect:non-scaling-stroke;opacity:0;transition:opacity .8s ease}
.campo-c line.on{opacity:.85}
.estrella{position:absolute;width:52px;height:52px;transform:translate(-50%,-50%);z-index:2}
.estrella::before{content:"";position:absolute;left:50%;top:50%;width:11px;height:11px;margin:-5.5px;border-radius:50%;background:#9fc8fa;box-shadow:0 0 14px 3px rgba(127,182,245,.6);animation:pulso 2.4s ease-in-out infinite;transition:background .3s,transform .3s}
.estrella.vista::before{background:#fff;transform:scale(1.4);box-shadow:0 0 18px 5px rgba(225,240,255,.6);animation:none}
@keyframes pulso{50%{transform:scale(1.5);opacity:.7}}
.fondo-e{position:absolute;width:2px;height:2px;border-radius:50%;background:#dcecff;opacity:.4;pointer-events:none;animation:titila 4s ease-in-out infinite}
@keyframes titila{50%{opacity:.08}}
.contador-c{font-size:14px;letter-spacing:.06em;color:#8fb3e6}
.razon-c{min-height:84px;display:flex;align-items:center;justify-content:center;padding:6px 8px;font-size:21px;font-style:italic;line-height:1.35;color:#fff}
.final-c{min-height:22px;font-size:17px;font-style:italic;color:#9fc8fa;opacity:0;transition:opacity .9s}
.final-c.on{opacity:1}
@media (prefers-reduced-motion:reduce){.estrella::before,.fondo-e{animation:none!important}}
.campo-c{height:312px}
.campo-c .guia-c{fill:none;stroke:#9fc8fa;stroke-width:1.2;stroke-dasharray:2 7;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.3}
.campo-c .rell-c{fill:rgba(127,182,245,.2);opacity:0;transition:opacity 1.2s}
.campo-c .perfil-c{fill:none;stroke:#dcecff;stroke-width:2.2;stroke-linejoin:round;vector-effect:non-scaling-stroke;opacity:0;transition:opacity 1.2s;filter:drop-shadow(0 0 6px #7fb6f5)}
.campo-c.completo .rell-c,.campo-c.completo .perfil-c{opacity:1}
.campo-c.completo svg{transform-origin:50% 50%;animation:latidoC 1.9s ease-in-out infinite}
@keyframes latidoC{50%{transform:scale(1.035)}}
@media (prefers-reduced-motion:reduce){.campo-c.completo svg{animation:none}}


/* =========== ventana de regalo =========== */
.velo{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(15,30,70,.35);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s}
.velo.on{opacity:1;visibility:visible}

/* =========== carta =========== */
#carta{z-index:70;flex-direction:column;background:rgba(15,30,70,.4)}
.cerrar-carta{position:absolute;right:16px;top:calc(env(safe-area-inset-top,0px) + 14px);z-index:3;width:40px;height:40px;border-radius:50%;background:rgba(253,254,255,.9);font-size:22px;line-height:1;color:var(--vino)}
.sobre-caja{text-align:center;transition:opacity .6s,transform .6s}
.sobre-caja.fuera{opacity:0;transform:translateY(30px) scale(.9);pointer-events:none;position:absolute}
.sobre{position:relative;width:min(78vw,320px);aspect-ratio:1.5;margin:0 auto;perspective:900px;filter:drop-shadow(0 18px 30px rgba(10,20,55,.35));animation:flota 3s ease-in-out infinite}
@keyframes flota{50%{transform:translateY(-6px)}}
.sobre .cuerpo{position:absolute;inset:0;border-radius:6px;background:linear-gradient(180deg,#dbe8fb,#c9dcf6)}
.sobre .lado{position:absolute;inset:0;border-radius:6px;background:#b9d0f2;clip-path:polygon(0 0,50% 55%,0 100%)}
.sobre .lado.d{clip-path:polygon(100% 0,50% 55%,100% 100%)}
.sobre .fondo{position:absolute;inset:0;border-radius:6px;background:#b1caee;clip-path:polygon(0 100%,50% 45%,100% 100%)}
.sobre .solapa{position:absolute;left:0;right:0;top:0;height:58%;background:#a4c1ea;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .9s ease,z-index 0s .45s;z-index:2}
.sobre.abierto .solapa{transform:rotateX(180deg);z-index:0}
.sello{position:absolute;left:50%;top:58%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;z-index:3;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#5b95f0,#1f4fb8);box-shadow:0 3px 8px rgba(10,30,90,.4);transition:opacity .4s}
.sello svg{width:22px;height:22px}
.sobre.abierto .sello{opacity:0}
.toca{margin-top:22px;font-style:italic;font-weight:600;font-size:18px;color:#f3f8ff;text-shadow:0 2px 10px rgba(10,20,55,.4)}
.papel-caja{width:min(90vw,440px);display:none}
.papel-caja.on{display:block;animation:papel 1s cubic-bezier(.2,.9,.3,1) both}
@keyframes papel{from{opacity:0;transform:translateY(60px) scale(.92)}to{opacity:1;transform:none}}
.papel{max-height:82dvh;overflow-y:auto;padding:30px 26px 32px;border-radius:8px;text-align:left;background:linear-gradient(180deg,#fdfeff,#f1f7ff);border:1px solid #d3e1f4;box-shadow:0 26px 60px rgba(10,20,55,.4)}
.papel .corazon-c{width:22px;height:22px;display:block;margin:0 auto 6px}
.papel h5{font-family:var(--script);font-weight:400;font-size:44px;line-height:1.1;text-align:center;color:#2c5cc0;margin-bottom:14px}
.papel .parrafo{font-weight:500;font-size:20.5px;line-height:1.6;color:#2b3a55;margin-bottom:14px;opacity:0;transform:translateY(8px)}
.papel-caja.on .parrafo{animation:leer .9s ease forwards;animation-delay:var(--d)}
@keyframes leer{to{opacity:1;transform:none}}
.papel .despedida{font-style:italic;margin-top:20px}
.papel .firma-c{font-family:var(--script);font-size:42px;line-height:1.1;color:#2c5cc0;margin-top:2px;opacity:0}
.papel-caja.on .firma-c{animation:leer 1s ease forwards;animation-delay:var(--d)}

#confeti{position:fixed;inset:0;width:100%;height:100%;z-index:80;pointer-events:none}

@media (prefers-reduced-motion:reduce){
  .pastel-svg *{animation:none!important;opacity:1!important;transform:none!important}
  .pastel-svg .humo{opacity:0!important}
  .halo,#corazon,.sobre,.desliza i,.arbol-caja svg{animation:none!important}
  .petalo{display:none}
}

<script>

const CONFIG = {

      "Yo se que muchas veces estas preocupado, frustrado o cansado de que todo sea difícil o de que las cosas no funcionen, pero yo quiero que sepas que a pesar de lo mucho que peleo y de que tu sientas que no te entiendo, yo lo que quiero es estar aquí para ti, quiero recordarte mil veces que siempre te apoyare y asi como he hecho hasta el dia de hoy seguire a tu lado en los momentos difíciles, no te voy a dejar solo y yo se que tu vas a lograr todo lo que te propongas, lo haremos juntos.",
      "Feliz cumpleaños mi corazón, mi mono bello, eres el amor de mi vida."
    ],

/* ===================================================================== */

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const NS = 'http://www.w3.org/2000/svg';
const rnd = (a, b) => a + Math.random() * (b - a);
const vibrar = ms => { if (navigator.vibrate) navigator.vibrate(ms); };

document.title = 'Feliz cumpleaños, ' + CONFIG.nombre + ' 💙';

/* ---------------------------------------------------------------
   1. FLECHA Y CORAZÓN
   --------------------------------------------------------------- */
const intro = $('#intro'), arco = $('#arco'), flecha = $('#flecha'), cuerda = $('#cuerda'), guia = $('#guia');
const escenario = $('#escenario'), corazon = $('#corazon');
const ESC = 0.95;              // tamaño del arco
const PULL_MAX = 80, PULL_MIN = 34;
let bx, by, hx, hy, ang, D0;
let pull = 0, estado = 'espera', origen = null, idle = null;

function medir() {
  const W = innerWidth, H = innerHeight;
  escenario.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  const r = corazon.getBoundingClientRect();
  hx = r.left + r.width / 2; hy = r.top + r.height / 2;
  bx = W * 0.2; by = H * 0.84;
  ang = Math.atan2(hy - by, hx - bx);
  D0 = Math.hypot(hx - bx, hy - by);
  dibujar(pull);
}
function dibujar(p, adelanto) {
  const g = ang * 180 / Math.PI;
  arco.setAttribute('transform', 'translate(' + bx + ' ' + by + ') rotate(' + g + ') scale(' + ESC + ')');
  cuerda.setAttribute('d', 'M0 -54 L' + (-p) + ' 0 L0 54');
  const x = (adelanto === undefined ? -p : adelanto);
  flecha.setAttribute('transform', 'translate(' + bx + ' ' + by + ') rotate(' + g + ') translate(' + (x * ESC) + ' 0) scale(' + ESC + ')');
  const a = Math.min(1, p / PULL_MAX);
  if (adelanto === undefined && p > 2) {
    const tx = bx + Math.cos(ang) * (-p * ESC + 96 * ESC), ty = by + Math.sin(ang) * (-p * ESC + 96 * ESC);
    guia.setAttribute('d', 'M' + tx + ' ' + ty + ' L' + hx + ' ' + hy);
    guia.setAttribute('opacity', (a * 0.55).toFixed(2));
  } else guia.setAttribute('opacity', 0);
}
function animarPull(desde, hasta, ms, fin) {
  const t0 = performance.now();
  (function paso(t) {
    const k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3);
    pull = desde + (hasta - desde) * e;
    dibujar(pull);
    if (k < 1) requestAnimationFrame(paso); else if (fin) fin();
  })(t0);
}
function invitar() {          // pequeña sugerencia: la flecha se tensa sola
  clearTimeout(idle);
  idle = setTimeout(function repetir() {
    if (estado !== 'espera') return;
    animarPull(0, 22, 700, () => setTimeout(() => {
      if (estado !== 'espera') return;
      animarPull(22, 0, 500, () => { idle = setTimeout(repetir, 2600); });
    }, 350));
  }, 3800);
}

intro.addEventListener('pointerdown', e => {
  if (estado !== 'espera') return;
  clearTimeout(idle);
  estado = 'jalando';
  origen = { x: e.clientX, y: e.clientY };
  pull = 0;
  intro.setPointerCapture(e.pointerId);
});
intro.addEventListener('pointermove', e => {
  if (estado !== 'jalando') return;
  const atras = { x: -Math.cos(ang), y: -Math.sin(ang) };
  const v = (e.clientX - origen.x) * atras.x + (e.clientY - origen.y) * atras.y;
  pull = Math.max(0, Math.min(PULL_MAX, v));
  dibujar(pull);
});
function soltar() {
  if (estado !== 'jalando') return;
  if (pull >= PULL_MIN) disparar();
  else { estado = 'espera'; animarPull(pull, 0, 260, invitar); }
}
intro.addEventListener('pointerup', soltar);
intro.addEventListener('pointercancel', soltar);
intro.addEventListener('contextmenu', e => e.preventDefault());

function disparar() {
  estado = 'volando';
  vibrar(25);
  $('#pistaArco').style.opacity = 0;
  cuerda.setAttribute('d', 'M0 -54 L0 0 L0 54');
  guia.setAttribute('opacity', 0);
  const desde = -pull, hasta = D0 / ESC - 96 + 4;
  const dur = 380, t0 = performance.now();
  (function vuelo(t) {
    const k = Math.min(1, (t - t0) / dur), e = k * k;
    dibujar(0, desde + (hasta - desde) * e);
    if (k < 1) requestAnimationFrame(vuelo); else impacto();
  })(t0);
}

async function impacto() {
  vibrar([40, 30, 60]);
  corazon.classList.add('pop');
  for (let i = 0; i < 26; i++) {
    const c = document.createElement('div');
    c.className = 'chispa';
    c.style.left = hx + 'px'; c.style.top = hy + 'px';
    const a = rnd(0, 6.283), d = rnd(50, 150), s = rnd(10, 22);
    c.style.setProperty('--dx', Math.cos(a) * d + 'px');
    c.style.setProperty('--dy', Math.sin(a) * d + 'px');
    c.style.setProperty('--rot', rnd(-160, 160) + 'deg');
    c.style.width = c.style.height = s + 'px';
    const tipo = ['h-rosa', 'h-claro', 'h-dorado', 'h-gran'][i % 4];
    c.innerHTML = '<svg viewBox="0 0 24 24"><use href="#' + tipo + '"/></svg>';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 1000);
  }
  flecha.style.transition = 'opacity .4s'; flecha.style.opacity = 0;
  arco.style.transition = 'opacity .6s'; arco.style.opacity = 0;
  await sleep(380);

  // el círculo rojo crece hasta cubrir la pantalla
  const disco = document.createElement('div');
  disco.className = 'disco';
  disco.style.left = hx + 'px'; disco.style.top = hy + 'px';
  document.body.appendChild(disco);
  const lejos = Math.max(Math.hypot(hx, hy), Math.hypot(innerWidth - hx, hy), Math.hypot(hx, innerHeight - hy), Math.hypot(innerWidth - hx, innerHeight - hy));
  requestAnimationFrame(() => requestAnimationFrame(() => { disco.style.transform = 'scale(' + ((lejos + 60) / 30 * 1.1) + ')'; }));
  await sleep(1000);
  $('#roja').classList.add('on');
  await sleep(450);
  intro.classList.add('oculto');
  disco.remove();
  await secuenciaRoja();
}

/* ---------------------------------------------------------------
   2. PANTALLA ROJA (feliz cumpleaños escrito letra por letra)
   --------------------------------------------------------------- */
function armar(idFila, texto) {
  const f = $(idFila);
  return [...texto].map(ch => {
    const s = document.createElement('span');
    s.className = 'letra'; s.textContent = ch;
    f.appendChild(s); return s;
  });
}
async function secuenciaRoja() {
  const letras = [...armar('#fila1', 'Feliz'), ...armar('#fila2', 'Cumpleaños')];
  await sleep(900);
  for (const l of letras) { l.classList.add('on'); await sleep(95); }
  await sleep(250);
  $('#subrayado').classList.add('on');
  await sleep(700);
  $('#sub').classList.add('on');
  await sleep(1300);
  $('#destello').classList.add('on');
  vibrar(30);
  await sleep(650);
  revelarArbol();
  $('#roja').classList.add('fuera');
}

/* ---------------------------------------------------------------
   3. ÁRBOL: crece, florece y caen pétalos
   --------------------------------------------------------------- */
function construirArbol() {
  // [trazo, grosor, retraso, duración]
  const ramas = [
    ['M150 360 C150 320 149 270 150 232', 11, 0,   1.4],
    ['M150 240 C130 212 90 196 68 150',   7,  1.0, 1.1],
    ['M150 240 C170 212 210 196 232 150', 7,  1.0, 1.1],
    ['M68 150 C55 120 62 85 90 62',       5,  1.7, 1.0],
    ['M232 150 C245 120 238 85 210 62',   5,  1.7, 1.0],
    ['M90 62 C105 50 128 58 150 96',      4,  2.2, 0.9],
    ['M210 62 C195 50 172 58 150 96',     4,  2.2, 0.9],
    ['M112 208 C102 170 104 130 124 100', 4,  1.9, 1.0],
    ['M188 208 C198 170 196 130 176 100', 4,  1.9, 1.0],
    ['M64 138 C48 130 40 118 38 100',     3,  2.5, 0.7],
    ['M236 138 C252 130 260 118 262 100', 3,  2.5, 0.7],
    ['M78 72 C70 60 72 48 84 40',         3,  2.7, 0.6],
    ['M222 72 C230 60 228 48 216 40',     3,  2.7, 0.6],
    ['M124 100 C118 84 124 70 136 62',    2.6, 2.8, 0.6],
    ['M176 100 C182 84 176 70 164 62',    2.6, 2.8, 0.6],
    ['M150 96 C150 80 146 66 150 52',     2.6, 2.6, 0.6]
  ];
  let html = '<g>';
  ramas.forEach(r => {
    html += '<path class="rama" pathLength="1" d="' + r[0] + '" stroke-width="' + r[1] + '" style="--d:' + r[2] + 's;--t:' + r[3] + 's"/>';
  });
  html += '</g><g>';
  const tipos = ['h-rosa', 'h-rosa', 'h-rosa', 'h-claro', 'h-claro', 'h-naranja', 'h-naranja', 'h-dorado'];
  const puntos = [];
  for (let i = 0; i < 180; i++) {
    const t = rnd(0, 6.2832), r = Math.sqrt(Math.random()) * 0.98;
    const rx = 16 * Math.pow(Math.sin(t), 3);
    const ry = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    puntos.push({ x: 150 + 7 * r * rx, y: 120 - 7 * r * ry, s: rnd(15, 27), t: tipos[Math.floor(Math.random() * tipos.length)], rot: rnd(-28, 28), d: 2.7 + rnd(0, 2.6) });
  }
  puntos.forEach(p => {
    html += '<g transform="translate(' + p.x.toFixed(1) + ' ' + p.y.toFixed(1) + ') rotate(' + p.rot.toFixed(0) + ')">' +
      '<g class="brote" style="--d:' + p.d.toFixed(2) + 's"><use href="#' + p.t + '" x="' + (-p.s / 2).toFixed(1) + '" y="' + (-p.s / 2).toFixed(1) + '" width="' + p.s.toFixed(1) + '" height="' + p.s.toFixed(1) + '"/></g></g>';
  });
  html += '</g>';
  $('#arbol').innerHTML = html;
}
function lanzarPetalos() {
  const cont = $('#petalos'), tipos = ['h-dorado', 'h-rosa', 'h-claro', 'h-naranja'];
  for (let i = 0; i < 16; i++) {
    const p = document.createElement('div');
    p.className = 'petalo';
    p.style.setProperty('--x', rnd(18, 82) + 'vw');
    p.style.setProperty('--s', rnd(11, 19) + 'px');
    p.style.setProperty('--t', rnd(9, 16) + 's');
    p.style.setProperty('--d', rnd(0, 10) + 's');
    p.style.setProperty('--dx', rnd(-60, 60) + 'px');
    p.style.setProperty('--r', rnd(-360, 360) + 'deg');
    p.innerHTML = '<svg viewBox="0 0 24 24"><use href="#' + tipos[i % 4] + '"/></svg>';
    cont.appendChild(p);
  }
}
function revelarArbol() {
  document.body.classList.add('arbol');
  setTimeout(lanzarPetalos, 3500);
}

/* ---------------------------------------------------------------
   4. TARJETAS: pastel, años, cielo, recuerdos, video, regalo, carta
   --------------------------------------------------------------- */
/* ---------------------------------------------------------------
   Pastel que se forma
   --------------------------------------------------------------- */
(function pastel() {
  const P = CONFIG.pastel, svg = $('#pastel');
  $('#paTitulo').textContent = P.titulo;
  $('#paAyuda').textContent = P.ayuda;
  $('#paFinal').textContent = P.final || '';
  let primera = true;
  function soplar() {
    const apagado = svg.classList.toggle('apagado');
    if (apagado && primera) {
      primera = false;
      const r = svg.getBoundingClientRect();
      confeti(r.left + r.width / 2, r.top + r.height * 0.3);
      vibrar([30, 40, 30]);
      setTimeout(() => $('#paFinal').classList.add('on'), 700);
    } else if (apagado) vibrar(20);
  }
  svg.addEventListener('click', soplar);
  svg.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); soplar(); } });
})();

/* ---------------------------------------------------------------
   Botón de los años (hasta el infinito)
   --------------------------------------------------------------- */
(function anios() {
  const A = CONFIG.anios, btn = $('#btnEdad'), num = $('#numEdad'), LIM = 1e6;
  $('#anTitulo').textContent = A.titulo;
  $('#anPista').textContent = A.pista;
  $('#anFinal').textContent = A.final || '';
  let n = Number(A.inicio) || 1, sostiene = false, ciclo = null, listo = false, t0 = 0;
  function pintar() {
    if (n >= LIM) { num.textContent = '∞'; num.style.fontSize = ''; btn.classList.add('infinito'); return; }
    const t = n.toLocaleString('es-CO');
    num.textContent = t;
    num.style.fontSize = t.length >= 9 ? '32px' : t.length >= 7 ? '40px' : t.length >= 5 ? '50px' : '';
  }
  function rebote() { btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop'); }
  function subir() {
    if (listo) return;
    n = n < 100 ? n + 1 : Math.ceil(n * 1.12);
    if (n >= LIM) { n = LIM; listo = true; }
    pintar(); rebote(); vibrar(8);
    if (listo) {
      const r = btn.getBoundingClientRect();
      confeti(r.left + r.width / 2, r.top + r.height / 2);
      vibrar([30, 40, 30]);
      setTimeout(() => $('#anFinal').classList.add('on'), 600);
    }
  }
  pintar();
  btn.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (listo) { rebote(); return; }
    sostiene = true; t0 = performance.now();
    subir();
    ciclo = setTimeout(function paso() {
      if (!sostiene || listo) return;
      subir();
      ciclo = setTimeout(paso, Math.max(24, 200 - (performance.now() - t0) * 0.12));
    }, 380);
  });
  const soltar = () => { sostiene = false; clearTimeout(ciclo); };
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => btn.addEventListener(t, soltar));
  btn.addEventListener('contextmenu', e => e.preventDefault());
  btn.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); subir(); } });
})();

/* ---------------------------------------------------------------
   Cielo: las estrellas forman un corazón
   --------------------------------------------------------------- */
(function cielo() {
  const C = CONFIG.cielo;
  const razones = C.razones.slice(0, 10), N = razones.length;
  if (!N) { $('#pCielo').classList.add('oculto'); return; }
  $('#cTituloCielo').textContent = C.titulo;
  $('#cAyudaCielo').textContent = C.ayuda;
  $('#finalCielo').textContent = C.final || '';
  const tarjeta = $('.cielo-card');
  for (let i = 0; i < 34; i++) {
    const d = document.createElement('div');
    d.className = 'fondo-e';
    d.style.left = rnd(2, 98) + '%'; d.style.top = rnd(2, 98) + '%';
    d.style.animationDelay = rnd(0, 4) + 's';
    tarjeta.prepend(d);
  }
  const rx = t => 16 * Math.pow(Math.sin(t), 3);
  const ry = t => 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
  const px = t => 50 + rx(t) / 16 * 41, py = t => 10 + (11.7 - ry(t)) / 28.7 * 78;
  const pos = razones.map((_, i) => { const t = Math.PI + 2 * Math.PI * i / N; return [px(t), py(t)]; });
  let d = '';
  for (let k = 0; k <= 90; k++) { const t = k / 90 * 2 * Math.PI; d += (k ? 'L' : 'M') + px(t).toFixed(2) + ' ' + py(t).toFixed(2); }
  d += 'Z';
  const campo = $('#campoCielo'), lineas = $('#lineasCielo'), razon = $('#razonCielo'), contador = $('#contadorCielo');
  lineas.innerHTML = '<path class="guia-c" d="' + d + '"/><path class="rell-c" d="' + d + '"/><path class="perfil-c" d="' + d + '"/>';
  const aristas = pos.map((p, i) => {
    const q = pos[(i + 1) % N], l = document.createElementNS(NS, 'line');
    l.setAttribute('x1', p[0]); l.setAttribute('y1', p[1]); l.setAttribute('x2', q[0]); l.setAttribute('y2', q[1]);
    lineas.appendChild(l); return l;
  });
  const vista = new Array(N).fill(false);
  let cuenta = 0;
  const marcador = () => { contador.textContent = cuenta + ' de ' + N; };
  marcador();
  function unir(i) {
    const j = (i + 1) % N;
    if (vista[i] && vista[j]) requestAnimationFrame(() => requestAnimationFrame(() => aristas[i].classList.add('on')));
  }
  razones.forEach((texto, i) => {
    const b = document.createElement('button');
    b.className = 'estrella';
    b.style.left = pos[i][0] + '%'; b.style.top = pos[i][1] + '%';
    b.setAttribute('aria-label', 'Estrella ' + (i + 1));
    b.addEventListener('click', () => {
      razon.textContent = texto;
      if (vista[i]) return;
      vista[i] = true; cuenta++; b.classList.add('vista');
      vibrar(15);
      unir(i); unir((i - 1 + N) % N);
      marcador();
      if (cuenta === N) setTimeout(() => {
        campo.classList.add('completo'); vibrar([30, 40, 30]);
        setTimeout(() => $('#finalCielo').classList.add('on'), 900);
      }, 800);
    });
    campo.appendChild(b);
  });
})();

/* ---------------------------------------------------------------
   Recuerdos: pila de fotos (desliza, toca para voltear)
   --------------------------------------------------------------- */
(function recuerdos() {
  const fotos = CONFIG.fotos.map(f => typeof f === 'string' ? { src: f, titulo: '', texto: '' } : f);
  const n = fotos.length, pila = $('#pila');
  $('#cuenta').textContent = n + ' fotos';
  $('#rAyuda').textContent = 'Desliza las fotos · toca para voltearlas';
  if (!n) { $('#pRecuerdos').classList.add('oculto'); return; }
  const cartas = fotos.map((f, i) => {
    const c = document.createElement('div');
    c.className = 'polaroid';
    c.innerHTML = '<div class="giro"><div class="cara frente"><div class="marco"><img alt=""><span class="hueco"></span></div><div class="leyenda"></div></div>' +
      '<div class="cara dorso"><h4></h4><p></p><p class="volver">TOCA PARA VOLVER</p></div></div>';
    const marco = c.querySelector('.marco'), img = c.querySelector('img');
    img.src = f.src; img.alt = f.titulo || 'Recuerdo ' + (i + 1); img.draggable = false;
    img.addEventListener('error', () => marco.classList.add('sinfoto'));
    c.querySelector('.hueco').textContent = 'Pon tu foto en: ' + f.src;
    c.querySelector('.leyenda').textContent = f.titulo || '';
    c.querySelector('h4').textContent = f.titulo || '';
    c.querySelectorAll('p')[0].textContent = f.texto || '';
    pila.appendChild(c);
    return c;
  });
  let orden = fotos.map((_, i) => i);
  const POS = [[0, 0, 0], [9, 10, 4], [-9, 18, -4]];
  function colocar() {
    orden.forEach((idx, k) => {
      const c = cartas[idx], p = POS[Math.min(k, 2)];
      c.style.transform = 'translate(' + p[0] + 'px,' + p[1] + 'px) rotate(' + p[2] + 'deg)';
      c.style.opacity = k > 2 ? 0 : 1;
      c.style.zIndex = n - k;
      c.style.pointerEvents = k === 0 ? 'auto' : 'none';
    });
    $('#rPos').textContent = (orden[0] + 1) + ' de ' + n;
  }
  function sinTransicion(fn) {
    cartas.forEach(c => c.style.transition = 'none'); fn(); void pila.offsetWidth;
    cartas.forEach(c => c.style.transition = '');
  }
  function volar(dir) {
    const c = cartas[orden[0]];
    c.style.transition = 'transform .32s ease-in,opacity .32s';
    c.style.transform = 'translate(' + dir * 420 + 'px,-30px) rotate(' + dir * 28 + 'deg)';
    c.style.opacity = 0;
    setTimeout(() => {
      sinTransicion(() => { c.classList.remove('voltea'); orden.push(orden.shift()); colocar(); });
    }, 330);
  }
  function anterior() {
    sinTransicion(() => { orden.unshift(orden.pop()); const c = cartas[orden[0]]; c.classList.remove('voltea'); colocar(); c.style.transform = 'translate(-420px,-30px) rotate(-28deg)'; c.style.opacity = 0; });
    requestAnimationFrame(() => requestAnimationFrame(() => colocar()));
  }
  $('#rSig').addEventListener('click', () => volar(-1));
  $('#rAnt').addEventListener('click', anterior);

  let arr = null;
  pila.addEventListener('pointerdown', e => {
    const c = cartas[orden[0]];
    if (!e.target.closest('.polaroid') || e.target.closest('.polaroid') !== c) return;
    arr = { x: e.clientX, y: e.clientY, t: performance.now(), dx: 0, mov: false, c };
    pila.setPointerCapture(e.pointerId);
  });
  pila.addEventListener('pointermove', e => {
    if (!arr) return;
    const dx = e.clientX - arr.x, dy = e.clientY - arr.y;
    if (!arr.mov && Math.hypot(dx, dy) > 7) { arr.mov = true; arr.c.classList.add('arrastrando'); }
    if (!arr.mov) return;
    arr.dx = dx;
    arr.c.style.transform = 'translate(' + dx + 'px,' + dy * 0.25 + 'px) rotate(' + dx * 0.06 + 'deg)';
  });
  function fin(e) {
    if (!arr) return;
    const a = arr; arr = null;
    a.c.classList.remove('arrastrando');
    const v = Math.abs(a.dx) / Math.max(1, performance.now() - a.t);
    if (a.mov && (Math.abs(a.dx) > 80 || v > 0.55)) { vibrar(10); volar(a.dx > 0 ? 1 : -1); }
    else if (!a.mov && e && e.type === 'pointerup') { a.c.classList.toggle('voltea'); vibrar(10); colocar(); }
    else colocar();
  }
  pila.addEventListener('pointerup', fin);
  pila.addEventListener('pointercancel', fin);
  colocar();
})();

/* ---------------------------------------------------------------
   Video
   --------------------------------------------------------------- */
(function video() {
  const V = CONFIG.video;
  if (!V || !V.src) { $('#pVideo').classList.add('oculto'); return; }
  const v = $('#video');
  $('#viTitulo').textContent = V.titulo;
  $('#viTexto').textContent = V.texto || '';
  if (V.poster) v.poster = V.poster;
  v.src = V.src;
  v.addEventListener('error', () => {
    v.classList.add('oculto');
    $('#sinVideo').textContent = 'Pon tu video en: ' + V.src;
    $('#sinVideo').classList.remove('oculto');
  });
})();

/* ---------------------------------------------------------------
   Regalo (caja) y carta
   --------------------------------------------------------------- */
(function regalo() {
  const R = CONFIG.regalo, caja = $('#caja'), vale = $('#vale');
  $('#gTitulo').textContent = R.titulo;
  $('#gAyuda').textContent = R.ayuda;
  $('#vTituloVale').textContent = R.valeTitulo;
  $('#vTextoVale').textContent = R.valeTexto;
  $('#abrirCartaBtn').textContent = '✉  ' + R.boton;
  if (R.codigo) { $('#vCodigoTxt').textContent = R.codigo; $('#vCodigo').classList.remove('oculto'); }
  caja.addEventListener('click', () => {
    if (caja.classList.contains('abierta')) return;
    caja.classList.add('abierta');
    vibrar([30, 40, 30]);
    const r = caja.getBoundingClientRect();
    confeti(r.left + r.width / 2, r.top + r.height * 0.3);
    $('#gAyuda').classList.add('oculto');
    setTimeout(() => {
      vale.classList.add('visible');
      setTimeout(() => vale.scrollIntoView({ behavior: 'smooth', block: 'center' }), 500);
    }, 350);
  });
  $('#copiar').addEventListener('click', () => {
    const b = $('#copiar'), txt = R.codigo;
    const listo = () => { b.textContent = 'Copiado'; setTimeout(() => b.textContent = 'Copiar', 1800); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(listo).catch(() => {});
    else { const t = document.createElement('textarea'); t.value = txt; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); listo(); } catch (e) {} t.remove(); }
  });
  $('#abrirCartaBtn').addEventListener('click', abrirCarta);

  // carta
  const c = CONFIG.carta;
  $('#cTitulo').textContent = c.titulo;
  c.parrafos.forEach((t, i) => {
    const p = document.createElement('p');
    p.className = 'parrafo'; p.textContent = t;
    p.style.setProperty('--d', (0.9 + i * 0.8) + 's');
    $('#cParrafos').appendChild(p);
  });
  const fin = 0.9 + c.parrafos.length * 0.8;
  $('#cDespedida').textContent = c.despedida;
  $('#cDespedida').style.setProperty('--d', fin + 's');
  $('#cFirma').textContent = CONFIG.firma;
  $('#cFirma').style.setProperty('--d', (fin + 0.5) + 's');
  $('#sobre').addEventListener('click', async () => {
    if ($('#sobre').classList.contains('abierto')) return;
    $('#sobre').classList.add('abierto');
    vibrar(30);
    await sleep(1000);
    $('#sobreCaja').classList.add('fuera');
    $('#papelCaja').classList.add('on');
  });
  $('#cerrarCarta').addEventListener('click', () => $('#carta').classList.remove('on'));
})();

/* ---------------------------------------------------------------
   Aparecer al deslizar
   --------------------------------------------------------------- */
(function aparecer() {
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) e.target.classList.add('visto'); }), { root: $('#rollo'), threshold: 0.12 });
  $$('.panel').forEach(p => io.observe(p));
  $('#rollo').addEventListener('scroll', () => { if ($('#rollo').scrollTop > 24) $('#desliza').classList.add('fuera'); }, { passive: true });
})();

function abrirCarta() {
  $('#sobre').classList.remove('abierto');
  $('#sobreCaja').classList.remove('fuera');
  $('#papelCaja').classList.remove('on');
  $('#papel').scrollTop = 0;
  $('#carta').classList.add('on');
}

/* ---------------------------------------------------------------
   Confeti del regalo
   --------------------------------------------------------------- */
function confeti(x, y) {
  const c = $('#confeti'), ctx = c.getContext('2d');
  const dpr = Math.min(devicePixelRatio || 1, 2);
  c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const colores = ['#2f6fe0', '#7fb6f5', '#dfe9f7', '#ffffff', '#9fc8fa', '#4cc3e6'];
  const piezas = Array.from({ length: 150 }, () => {
    const a = rnd(-Math.PI, 0), v = rnd(4, 13);
    return { x, y, vx: Math.cos(a) * v * rnd(.6, 1.3), vy: Math.sin(a) * v, w: rnd(5, 10), h: rnd(4, 9),
      r: rnd(0, 6.28), vr: rnd(-.3, .3), c: colores[Math.floor(Math.random() * colores.length)], o: Math.random() < .3 };
  });
  const t0 = performance.now();
  (function cuadro(t) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    piezas.forEach(p => {
      p.vy += 0.22; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      if (p.o) { ctx.beginPath(); ctx.arc(0, 0, p.w / 2, 0, 6.28); ctx.fill(); } else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    if (t - t0 < 2600) requestAnimationFrame(cuadro); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })(t0);
}

/* ---------------------------------------------------------------
   Arranque
   --------------------------------------------------------------- */
construirArbol();
addEventListener('resize', () => { if (estado === 'espera' || estado === 'jalando') medir(); });
document.fonts && document.fonts.ready.then(medir);
medir();
invitar();
</script>
